<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сёрф Раннер</title>
    <style>
        body { margin: 0; background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: Arial, sans-serif; }
        #gameCanvas { background-color: #87CEEB; border: 4px solid #34495e; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #scoreDisplay { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px black; z-index: 10; }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 30px; border-radius: 15px; text-align: center; display: none; z-index: 20; }
        #gameOver h1 { margin: 0 0 10px 0; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="scoreDisplay">Счет: 0</div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="gameOver">
        <h1>Игра окончена!</h1>
        <p id="finalScore"></p>
        <button onclick="resetGame()">Играть снова</button>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('scoreDisplay');
const gameOverScreen = document.getElementById('gameOver');
const finalScoreText = document.getElementById('finalScore');

// Настройки
const LANE_X = [150, 270, 390]; // Координаты трех дорожек
const GRAVITY = 0.6;
const JUMP_FORCE = -15;

// Состояния
let player = { x: LANE_X[1], y: 280, width: 50, height: 50, vy: 0, isJumping: false };
let obstacles = [];
let coins = [];
let score = 0;
let speed = 5;
let gameOver = false;
let lastObstacleTime = 0;
let lastCoinTime = 0;

// Управление
let moveLeft = false;
let moveRight = false;

// Слушатели событий
window.addEventListener('keydown', (e) => {
    if (gameOver) return;
    if (e.code === 'ArrowLeft') moveLeft = true;
    if (e.code === 'ArrowRight') moveRight = true;
    if (e.code === 'Space' && !player.isJumping) {
        player.vy = JUMP_FORCE;
        player.isJumping = true;
    }
});

window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft') moveLeft = false;
    if (e.code === 'ArrowRight') moveRight = false;
});

// Функции рисования
function drawPlayer() {
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(player.x, player.y, player.width, player.height);
}

function drawObstacle(obs) {
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
    // Колеса
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(obs.x + 15, obs.y + obs.height, 10, 0, Math.PI * 2);
    ctx.arc(obs.x + obs.width - 15, obs.y + obs.height, 10, 0, Math.PI * 2);
    ctx.fill();
}

function drawCoin(coin) {
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(coin.x + coin.size/2, coin.y + coin.size/2, coin.size/2, 0, Math.PI * 2);
    ctx.fill();
    // Блеск
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(coin.x + coin.size/2 - 5, coin.y + coin.size/2 - 5, 3, 0, Math.PI * 2);
    ctx.fill();
}

// Логика игры
function spawnObstacle() {
    const lane = LANE_X[Math.floor(Math.random() * 3)];
    obstacles.push({ x: canvas.width, y: 300, width: 60, height: 40, lane });
}

function spawnCoin() {
    const lane = LANE_X[Math.floor(Math.random() * 3)];
    coins.push({ x: canvas.width, y: 280, size: 25, lane });
}

function checkCollision(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
}

function resetGame() {
    player = { x: LANE_X[1], y: 280, width: 50, height: 50, vy: 0, isJumping: false };
    obstacles = [];
    coins = [];
    score = 0;
    speed = 5;
    gameOver = false;
    lastObstacleTime = 0;
    lastCoinTime = 0;
    scoreDisplay.textContent = "Счет: 0";
    gameOverScreen.style.display = 'none';
    requestAnimationFrame(gameLoop);
}

function gameLoop() {
    if (gameOver) return;

    // Очистка холста
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Рисуем рельсы
    ctx.fillStyle = '#34495e';
    ctx.fillRect(0, 320, canvas.width, 80);
    ctx.fillStyle = '#5D4037';
    ctx.fillRect(0, 330, canvas.width, 10);
    ctx.fillRect(0, 350, canvas.width, 10);

    // Движение и отрисовка препятствий
    obstacles.forEach((obs, index) => {
        obs.x -= speed;
        drawObstacle(obs);
        if (checkCollision(player, obs)) {
            gameOver = true;
        }
        if (obs.x + obs.width < 0) {
            obstacles.splice(index, 1);
            score += 1;
            speed += 0.05;
            scoreDisplay.textContent = "Счет: " + score;
        }
    });

    // Движение и отрисовка монет
    coins.forEach((coin, index) => {
        coin.x -= speed;
        drawCoin(coin);
        if (checkCollision(player, coin)) {
            coins.splice(index, 1);
            score += 5;
            scoreDisplay.textContent = "Счет: " + score;
        }
        if (coin.x + coin.size < 0) {
            coins.splice(index, 1);
        }
    });

    // Физика игрока
    player.vy += GRAVITY;
    player.y += player.vy;
    
    // Прыжок
    if (player.y >= 280) {
        player.y = 280;
        player.vy = 0;
        player.isJumping = false;
    }

    // Смена полосы
    if (moveLeft && !moveRight) {
        const currentIndex = LANE_X.indexOf(player.x);
        if (currentIndex > 0) player.x = LANE_X[currentIndex - 1];
    }
    if (moveRight && !moveLeft) {
        const currentIndex = LANE_X.indexOf(player.x);
        if (currentIndex < LANE_X.length - 1) player.x = LANE_X[currentIndex + 1];
    }

    drawPlayer();

    // Спавн объектов по времени
    if (Date.now() - lastObstacleTime > 1500) {
        spawnObstacle();
        lastObstacleTime = Date.now();
    }
    if (Date.now() - lastCoinTime > 2000) {
        spawnCoin();
        lastCoinTime = Date.now();
    }

    if (!gameOver) {
        requestAnimationFrame(gameLoop);
    } else {
        finalScoreText.textContent = "Ваш счет: " + score;
        gameOverScreen.style.display = 'block';
    }
}

// Запуск игры
gameLoop();
</script>

</body>
</html>
